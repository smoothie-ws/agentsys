# AgentSys Server behind nginx, with HTTPS. The server itself listens on loopback and needs no TLS.
# Replace agentsys.example.com and the certificate paths, then: nginx -t && systemctl reload nginx.
#
# The important parts:
# - Host is passed through unchanged, and --allowed-host is not needed with a proxy that does this.
# - X-Forwarded-Proto tells the server to mark its session cookie Secure (start it with --trust-proxy).
# - proxy_buffering off and a long read timeout keep the /api/events stream alive.
server {
    listen 443 ssl;
    http2 on;
    server_name agentsys.example.com;

    ssl_certificate     /etc/letsencrypt/live/agentsys.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentsys.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        # Server-Sent Events: no buffering, no premature close.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # The client is a separate static program (bin/agentsys-client.js) or any static host.
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name agentsys.example.com;
    return 301 https://$host$request_uri;
}
