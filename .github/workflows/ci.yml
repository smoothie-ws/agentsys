name: test

on:
  push:
    branches: [main, 'platform/**', 'audit/**', 'hardening/**', 'certification/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node suite (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies: the project uses Node built-in modules only.
      - run: npm test

  browser:
    name: Browser suite (Playwright, ${{ matrix.browser }})
    # Keep the OS and browser bundle compatible instead of following an untested runner image rollover.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      AGENTSYS_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium firefox webkit
      # The split end-to-end test, the plugin isolation test, the editor and the interface checks.
      - run: python tests/browser_suite.py plugin_platform plugin_certification plugin_security
      - if: matrix.browser == 'chromium'
        run: python tests/browser_suite.py platform editor ux
      # The interface checks also run on the other two engines.
      - if: matrix.browser != 'chromium'
        run: python tests/browser_ux.py ${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: |
            node_modules/.cache/ui-review
            node_modules/.cache/browser-tests
          if-no-files-found: ignore
