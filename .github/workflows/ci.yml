name: test

on:
  push:
    branches: [main, 'platform/**', 'audit/**', 'hardening/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node suite (Linux, Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No dependencies: the project uses Node built-in modules only.
      - run: npm test

  browser:
    name: Browser suite (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium firefox
      # The split end-to-end test, the plugin isolation test and the interface checks.
      - run: python tests/browser_suite.py platform plugin_security ux
      # The interface checks also run on a second engine.
      - run: python tests/browser_ux.py firefox
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/audits/platform-marathon/screenshots
          if-no-files-found: ignore
