<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentSys</title>
<style>
  :root { color-scheme: light dark; --bg: #0e0f13; --text: #eceef3; --muted: #9aa1b2; --accent: #ff7a45; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f6f8; --text: #1a1c22; --muted: #5d6475; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 34rem; text-align: center; }
  .mark { width: 56px; height: 56px; margin: 0 auto 1.2rem; border-radius: 50%; background: linear-gradient(135deg, #ff7a45 50%, #7b6bd6 50%); }
  h1 { margin: 0 0 0.4rem; font-size: 2.2rem; }
  p { margin: 0 0 1.6rem; color: var(--muted); }
  a.button { display: inline-block; padding: 0.7rem 1.6rem; border-radius: 999px; background: var(--accent); color: #1a0d05; font-weight: 600; text-decoration: none; }
  a.button:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>AgentSys</h1>
  <p>A node-graph editor for building and running agent workflows.</p>
  <a class="button" href="/editor/">Open the editor</a>
</main>
</body>
</html>
